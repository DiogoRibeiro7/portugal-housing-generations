name: portugal-housing-generations

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      task:
        description: Which source to download (on a branch); package or release the version in CITATION.cff (on main)
        type: choice
        options:
          - mortgage-rates
          - regional
          - affordability
          - rental
          - national
          - package
          - release
        default: mortgage-rates
      approved_sha256:
        description: For release only, the SHA-256 of the artifact approved from a package run
        required: false
        default: ''

permissions:
  contents: read

# The package lives in src/ and needs no installation: every step finds it on the module path.
env:
  PYTHONPATH: src

jobs:
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check the pinned data against their checksums
        working-directory: data
        run: sha256sum --check --strict --quiet SHA256SUMS

      - name: Run the tests
        run: python -m unittest discover -s tests -t . -v

      - name: Rebuild the results from the pinned snapshots and compare
        run: |
          python -m housing_pt.national > /dev/null
          python -m housing_pt.regional > /dev/null
          python -m housing_pt.affordability > /dev/null
          python -m housing_pt.rental > /dev/null
          python -m housing_pt.integrated > /dev/null
          python -m housing_pt.sources.data_sources > /dev/null
          git diff --exit-code -- results docs/data-sources.csv

      # Redraws every figure and reports, as a warning, any PNG whose bytes or pixels
      # differ from the committed one; it fails only if a script fails.
      - name: Reproduce the release, including the figures
        if: matrix.python-version == '3.13'
        run: |
          python -m pip install matplotlib==3.11.2
          python reproduce.py

  # package: reproduces every result, checks that every data file may be redistributed, and builds the release
  # artifact (git archive of the commit), its SHA-256 and a per-file SHA-256 manifest as a workflow artifact for
  # review. It publishes nothing.
  # release: repeats the checks, rebuilds the same artifact, refuses to continue unless its SHA-256 equals the
  # approved value, then creates the annotated tag and the GitHub release with the artifact and checksums attached.
  # Zenodo's GitHub integration archives the release from .zenodo.json. Both run only on main.
  package:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.task == 'package' || inputs.task == 'release')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Reproduce the release
        run: |
          python -m pip install matplotlib==3.11.2
          python reproduce.py

      # Stops here while any data file's redistribution has not been established (see docs/data-sources.md).
      - name: Check that every data file may be redistributed
        run: python -m housing_pt.sources.data_sources --check-redistribution

      - name: Build the artifact, its SHA-256 and the per-file manifest
        id: package
        run: |
          version=$(sed -n 's/^version: *//p' CITATION.cff)
          tag="portugal-housing-generations-v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null; then
            echo "::error::${tag} already exists"
            exit 1
          fi
          mkdir -p dist/extract
          git archive --format=zip --prefix="${tag}/" -o "dist/${tag}.zip" "${GITHUB_SHA}"
          (cd dist && sha256sum "${tag}.zip" > "${tag}.zip.sha256" && sha256sum --check "${tag}.zip.sha256")
          unzip -q "dist/${tag}.zip" -d dist/extract
          (cd "dist/extract/${tag}" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > "dist/${tag}.files.sha256"
          rm -rf dist/extract
          sha256=$(cut -d' ' -f1 "dist/${tag}.zip.sha256")
          echo "::notice title=Artifact::${tag}.zip sha256 ${sha256} (commit ${GITHUB_SHA})"
          { echo "tag=${tag}"; echo "version=${version}"; echo "sha256=${sha256}"; } >> "$GITHUB_OUTPUT"

      - name: Upload the artifact for review
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.tag }}
          path: dist/
          if-no-files-found: error

      - name: Check the approved SHA-256
        if: inputs.task == 'release'
        run: |
          if [ "${{ inputs.approved_sha256 }}" != "${{ steps.package.outputs.sha256 }}" ]; then
            echo "::error::built ${{ steps.package.outputs.sha256 }}, approved '${{ inputs.approved_sha256 }}'"
            exit 1
          fi

      - name: Create the annotated tag
        if: inputs.task == 'release'
        run: |
          git config user.name "Diogo Ribeiro"
          git config user.email "diogo_dj@hotmail.com"
          git tag -a "${{ steps.package.outputs.tag }}" -m "Portugal housing research release v${{ steps.package.outputs.version }}" "${GITHUB_SHA}"
          git push origin "refs/tags/${{ steps.package.outputs.tag }}"

      - name: Create the GitHub release with the artifact
        if: inputs.task == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.package.outputs.tag }}" --verify-tag \
            --title "Portugal housing research release v${{ steps.package.outputs.version }}" \
            --notes-file "docs/release/notes-v${{ steps.package.outputs.version }}.md" \
            dist/*.zip dist/*.sha256

  # Refreshing the ECB series is a manual, reviewed step: dispatch this workflow
  # on a branch other than main; the job commits the dated raw response and its
  # retrieval record to that branch, and the change is reviewed in a pull request.
  # The defaults in src/housing_pt/national.py then have to be pointed at the new files.
  fetch-mortgage-rates:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && inputs.task == 'mortgage-rates'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Download the ECB cost-of-borrowing series
        run: python -m housing_pt.sources.fetch_mortgage_rates --out data

      - name: Commit the raw snapshot and its retrieval record
        run: |
          git config user.name "Diogo Ribeiro"
          git config user.email "diogo_dj@hotmail.com"
          git add data/ecb_mir_PT_house_purchase_cost_of_borrowing_*
          if git diff --cached --quiet; then
            echo "Snapshot unchanged."
          else
            git commit -m "Pin ECB cost-of-borrowing snapshot ($(date -u +%Y-%m-%d))"
            git push
          fi

  fetch-regional:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && (inputs.task == 'regional' || inputs.task == 'affordability' || inputs.task == 'rental' || inputs.task == 'national')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Download the INE series
        run: python -m housing_pt.sources.fetch_regional --out data --set ${{ inputs.task }}

      - name: Commit the outputs
        if: always()
        run: |
          git config user.name "Diogo Ribeiro"
          git config user.email "diogo_dj@hotmail.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "Regional sources: runner output ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
